<section id="$idprefix$title-slide" class="quarto-title-block center" data-background-color="#ffffff">
  <!-- Logo at top left -->
  <div style="position: absolute !important; top: 40px !important; left: 40px !important; z-index: 1000 !important;">
    <img src="$logo$" alt="Logo" width="130">
  </div>

  <div class="title-container" style="margin-top: 30px !important; text-align: center !important;">
    $if(subtitle)$
    <div class="course-header" style="font-family: 'Heliotrope', 'Georgia', serif; font-weight: 700; font-size: 1.15em !important; color: #d71920; margin-bottom: 0.9em; letter-spacing: 0.04em;">
      <span class="course-code">$subtitle$</span>
    </div>
    $endif$

    <h1 class="title" style="font-size: 2.85em !important; color: #222222 !important; font-weight: 700 !important; margin-bottom: 0.55em !important; line-height: 1.15 !important;">$title$</h1>

    <div class="lecture-info" style="font-family: 'Heliotrope', 'Georgia', serif; font-size: 1.25em !important; color: #555; margin-bottom: 1.0em; display: flex; align-items: center; justify-content: center; gap: 0.5em; font-weight: 300;">
      $if(lecture-num)$
      <span class="lecture-num" style="color: #555; font-weight: 500;">$lecture-num$</span>
      $else$
      <span class="lecture-num" style="color: #555; font-weight: 500;">Lecture 5</span>
      $endif$
      $if(date)$
      <span class="lecture-divider" style="color: #bbb; margin: 0 0.3em; font-weight: 300;">|</span>
      <span class="lecture-date" style="color: #666; font-weight: 400;">$date$</span>
      $endif$
    </div>
  </div>

  <!-- Presenter info at bottom right -->
  <div style="position: absolute !important; bottom: 45px !important; right: 45px !important; z-index: 1000 !important; text-align: right !important;">
    $if(author)$
    <div style="font-family: 'Heliotrope', 'Georgia', serif; font-size: 1.0em !important; color: #444; font-weight: 500;">$author$</div>
    $endif$
    $if(institute)$
    <div style="font-family: 'Heliotrope', 'Georgia', serif; font-size: 0.85em !important; color: #777; font-weight: 400; margin-top: 3px;">$institute$</div>
    $endif$
  </div>
</section>
